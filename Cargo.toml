[workspace]
resolver = "3"
members = ["crates/sim-core", "crates/sim-state", "crates/sim-rules", "crates/sim-agent", "crates/sim-ffi", "crates/sim-render", "test"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-rules = { path = "crates/sim-rules" }
sim-state = { path = "crates/sim-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
toml = "1"
# no_float + only_i64: script arithmetic stays platform-independent and deterministic
# sync: rules are evaluated on multiple cores
rhai = { version = "1.26", features = ["no_float", "only_i64", "sync"] }
rayon = "1.12"

# Lean debug builds: our code keeps line numbers (readable panics and backtraces), dependencies carry no debug
# info at all. A debug test build is several times smaller and links faster; step into a dependency with a
# debugger by raising its `debug` here.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
