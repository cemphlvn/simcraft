# The iOS app around sim-mobile (docs/architecture.md, Platforms and builds). `tools/mobile/build.sh ios ...` builds
# the Rust library first, then generates Simcraft.xcodeproj from this file (generated, not committed) and builds it.
name: Simcraft
options:
  bundleIdPrefix: dev.simcraft
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: NK8ZK38S8A
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Simcraft:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # Bundled games (data, never code): tools/mobile/build.sh copies $SIMCRAFT_GAMES here.
      - path: Generated/Games
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: simcraft
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [metal]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        # ProMotion: without this key iOS caps third-party apps at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.simcraft.mobile
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Rust static library, one per SDK, built by tools/mobile/build.sh before Xcode runs. Linked by path:
        # `-lsim_mobile` would pick the shared library cargo builds next to it.
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../../target/aarch64-apple-ios-sim/release/libsim_mobile.a
        "OTHER_LDFLAGS[sdk=iphoneos*]": $(PROJECT_DIR)/../../../target/aarch64-apple-ios/release/libsim_mobile.a
        # Apple silicon only (the Rust library is built for arm64).
        ARCHS: arm64
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
