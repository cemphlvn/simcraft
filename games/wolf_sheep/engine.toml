# ─────────────────────────────────────────────────────────────
#  STEAM ENGINE — operator panel
#  Does not change the game (that lives in game.ron). Sets how the engine burns:
#  the boiler (seed, duration), switches (rules on/off), hyperparameters.
#  Unknown key, rule or parameter → the engine won't start (validate).
# ─────────────────────────────────────────────────────────────

[run]
seed = 42
max_ticks = 500

[world]
width = 32
height = 16

# First coal in the boiler: starting population
[spawn]
sheep = 40
wolf = 5

# Switches — rule name = switch name. Rules not listed are on.
[switches]
metabolism = true
starvation = true
graze = true
sheep_breeding = true
predation = true
wolf_breeding = true

# Hyperparameters — override the `params` defaults in game.ron.
# This set kept both species alive for 500 ticks on 5 seeds (42,7,99,1,2), with oscillation.
# At wolf_breed_chance = 10, on 4 of 5 seeds the wolves wipe out the sheep and then starve.
[params]
wolf_hunt_at = 12
sheep_breed_chance = 10
wolf_breed_chance = 3
starve_at = 30

# Safety valve — the most operations a single expression/script may perform.
[rhai]
max_operations = 10000
max_call_levels = 16

# Agent interface
[agent]
controllable = ["wolf"]
observe_radius = 5
