# ─────────────────────────────────────────────────────────────
#  BUHARLI MOTOR — yönetici paneli
#  Oyunu değiştirmez (o game.ron'da). Motorun nasıl yanacağını ayarlar:
#  kazan (seed, süre), şalterler (kurallar açık/kapalı), hiperparametreler.
#  Bilinmeyen anahtar, kural ya da parametre → motor çalışmaz (validate).
# ─────────────────────────────────────────────────────────────

[run]
seed = 42
max_ticks = 500

[world]
width = 32
height = 16

# Kazana atılan ilk kömür: başlangıç nüfusu
[spawn]
sheep = 40
wolf = 5

# Şalterler — kural adı = şalter adı. Yazılmayan kural açıktır.
[switches]
metabolism = true
starvation = true
graze = true
sheep_breeding = true
predation = true
wolf_breeding = true

# Hiperparametreler — game.ron `params` varsayılanlarını ezer.
# Bu set 5 seed'de (42,7,99,1,2) 500 tick iki türü de hayatta tuttu; salınım var.
# wolf_breed_chance 10'a çıkınca 5 seed'in 4'ünde kurtlar koyunu bitirip kendileri de ölüyor.
[params]
wolf_hunt_at = 12
sheep_breed_chance = 10
wolf_breed_chance = 3
starve_at = 30

# Emniyet ventili — bir ifade/script en fazla bu kadar işlem yapabilir.
[rhai]
max_operations = 10000
max_call_levels = 16

# Agent arayüzü
[agent]
controllable = ["wolf"]
observe_radius = 5
