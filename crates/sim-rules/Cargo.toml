[package]
name = "sim-rules"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
sim-core.workspace = true
sim-state.workspace = true
serde.workspace = true
ron.workspace = true
toml.workspace = true
rhai.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["parallel"]
# Rule evaluation on every core. Off for the browser (wasm has no threads here).
parallel = ["dep:rayon"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
rhai = { workspace = true, features = ["wasm-bindgen"] }

