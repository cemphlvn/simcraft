[package]
name = "sim-render"
edition.workspace = true
version.workspace = true
license.workspace = true
# `cargo run -p sim-render -- <game>` opens the viewer; the pixelate tool needs `--bin simcraft-pixelate`.
default-run = "simcraft-view"

[[bin]]
name = "simcraft-view"
path = "src/bin/simcraft-view.rs"

[dependencies]
sim-core.workspace = true
sim-rules.workspace = true
sim-state.workspace = true
serde.workspace = true
ron.workspace = true
crossterm = "0.29"
flate2 = "1"
png = "0.18"

[[bin]]
name = "simcraft-pixelate"
path = "src/bin/simcraft-pixelate.rs"

[[bin]]
name = "simcraft-feel"
path = "src/bin/simcraft-feel.rs"
