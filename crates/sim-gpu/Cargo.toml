[package]
name = "sim-gpu"
description = "The HD 2.5D renderer: a game's stage (layers at real depths, sprites, soil cut open) drawn with wgpu"
edition.workspace = true
version.workspace = true
license.workspace = true
default-run = "simcraft-play"

[[bin]]
name = "simcraft-play"
path = "src/bin/simcraft-play.rs"

[dependencies]
sim-core.workspace = true
sim-rules.workspace = true
sim-physics.workspace = true
sim-state.workspace = true
sim-render = { path = "../sim-render" }
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
gltf.workspace = true
ron.workspace = true
wgpu = "29"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# Music (a track theme's loop): the standard Rust audio player.
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3"] }

[[bin]]
name = "simcraft-import"
path = "src/bin/simcraft-import.rs"

[[bin]]
name = "simcraft-check"
path = "src/bin/simcraft-check.rs"

[lints]
workspace = true
